name: CI

on:
  pull_request:
    # labeled/unlabeled: the coverage guard reads the `coverage-exception`
    # label, so adding or removing it re-runs the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale runs on pull requests only; every push to main completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Placeholder configuration so env validation (src/env.js) passes during
  # typegen and builds. None of these are real credentials and nothing in CI
  # talks to the services they belong to.
  DATABASE_URL: file:./ci.db
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ci-placeholder
  NEXT_PUBLIC_STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
  AUTH_SECRET: ci-placeholder-auth-secret-0123456789abcdef
  CLOUDINARY_API_KEY: ci-placeholder
  CLOUDINARY_API_SECRET: ci-placeholder
  CLOUDINARY_CLOUD_NAME: ci-placeholder
  EMAIL_FROM: ci@example.com
  GOOGLE_CLIENT_ID: ci-placeholder
  GOOGLE_CLIENT_SECRET: ci-placeholder
  GOOGLE_PLACES_API_KEY: ci-placeholder
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  # Price ids come from the Stripe dashboard; placeholders here. Checkout
  # needs all four. STRIPE_API_BASE_URL (test-only, loopback-only, refused in
  # production) is deliberately not set: tests start their own stub.
  STRIPE_FOUNDING_MONTHLY_PRICE_ID: price_ci_founding_monthly
  STRIPE_FOUNDING_ANNUAL_PRICE_ID: price_ci_founding_annual
  STRIPE_STANDARD_MONTHLY_PRICE_ID: price_ci_standard_monthly
  STRIPE_STANDARD_ANNUAL_PRICE_ID: price_ci_standard_annual

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Diff coverage compares against the pull request's base branch,
          # so it needs the base branch and history back to the merge base.
          # Always full: an expression like `cond && 0 || 1` evaluates to 1,
          # because 0 is falsy in Actions expressions.
          fetch-depth: 0
          # No step pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Applies every file in migrations/ to a scratch SQLite database and
      # fails if the result differs from prisma/schema.prisma, so a schema
      # change cannot merge without its migration (docs/DATABASE.md).
      - name: Migrations match the Prisma schema
        run: npm run db:check

      # The three test-bar steps below call their tools directly, not through
      # package.json scripts, so editing a script cannot switch a gate off.

      # Vitest with coverage. Fails if any threshold in
      # coverage-thresholds.json is missed (global and per directory); see
      # docs/TESTING.md for the bar and how it ratchets up.
      - name: Test with coverage
        run: npx vitest run --coverage

      # Of the lines this pull request adds or edits under src/ (tests
      # excluded), at least 90% must be run by the suite. The report lists
      # each uncovered line and is also written to the job summary.
      - name: Diff coverage (90% of changed lines)
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/diff-coverage.mjs --base "$BASE" --threshold 90

      # The bar only rises: fails if a threshold in coverage-thresholds.json
      # is lowered or removed, or coverage.config.mjs measures less, compared
      # with the base branch. The `coverage-exception` label allows it
      # (docs/TESTING.md). --bootstrap only while the base predates the guard.
      - name: Coverage guard (thresholds and what is measured)
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-exception') }}
        run: |
          args=(--base "$BASE")
          if [ "$EXCEPTION" = "true" ]; then args+=(--exception); fi
          if ! git cat-file -e "$BASE:coverage.config.mjs" 2>/dev/null; then args+=(--bootstrap); fi
          node scripts/coverage-guard.mjs "${args[@]}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build (Next.js + Cloudflare Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # OpenNext runs `next build` itself, so this is the only build.
      #
      # CI never uploads source maps and holds no PostHog credentials: maps
      # are uploaded by `npm run deploy:*`, for exactly the files being
      # deployed (docs/DEPLOYMENT.md, "Source maps").
      #
      # SOURCEMAPS=dry-run makes the build generate browser source maps and
      # the build's last step (`postbuild:cf`, scripts/sourcemaps.mjs) run
      # the PostHog CLI over them in its dry-run mode (no credentials, no
      # network), then remove every map from the assets. That exercises the
      # same path a deploy takes, and the next step checks the removal.
      - name: Build Next.js and the Cloudflare Worker (OpenNext), source map dry run
        run: npm run build:cf
        env:
          SOURCEMAPS: dry-run

      - name: No source maps in the deployable assets
        run: |
          if find .open-next/assets -name '*.map' | grep -q .; then
            echo "Source maps found in .open-next/assets" >&2
            exit 1
          fi

      # Bundles with `wrangler deploy --dry-run` (no upload, no credentials),
      # then fails if the gzipped Worker exceeds 9.5 MiB (Cloudflare's limit
      # is 10 MiB) or the Prisma WASM module is missing from the bundle.
      - name: Worker bundle dry run and size budget
        run: npm run check:bundle -- --outdir "$RUNNER_TEMP/worker-bundle"

  e2e:
    name: End-to-end smoke (workerd + local D1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The origin the tests use (e2e/config.mjs), baked into the build.
      NEXT_PUBLIC_BASE_URL: http://localhost:8788
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is cached per Playwright version; the system libraries it
      # needs are installed on every run (they are not in the cache).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build Next.js and the Cloudflare Worker (OpenNext)
        run: npm run build:cf

      # e2e/serve.mjs migrates and seeds a fresh local D1, then runs the built
      # Worker under `wrangler dev`; Playwright drives Chromium against it.
      - name: Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
