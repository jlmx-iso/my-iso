name: Test bar guard

# Fails a pull request that changes the files making up the test bar
# (thresholds, what coverage measures, the checks and the workflows that
# run them: scripts/test-bar-paths.mjs) unless it has the
# `coverage-exception` label. Raising thresholds only (a ratchet) needs no
# label.
#
# pull_request_target: GitHub runs the BASE branch's copy of this workflow
# and of the script, so a pull request cannot weaken or delete this check.
# For the same reason it NEVER checks out or runs the pull request's code:
# it checks out the base commit, reads the list of changed file names from
# the API, and, for coverage-thresholds.json, the two JSON texts as data.
# Takes effect once it is on the default branch; make it a required status
# check (docs/TESTING.md).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-bar-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Test bar guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the base commit (never the pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          echo "$(wc -l < "$RUNNER_TEMP/changed.txt") changed paths"

      # Only the JSON text, read through the API as data.
      - name: Thresholds before and after
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if grep -qx 'coverage-thresholds.json' "$RUNNER_TEMP/changed.txt"; then
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$BASE_REPO/contents/coverage-thresholds.json?ref=$BASE_SHA" > "$RUNNER_TEMP/thresholds-base.json" || rm -f "$RUNNER_TEMP/thresholds-base.json"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$HEAD_REPO/contents/coverage-thresholds.json?ref=$HEAD_SHA" > "$RUNNER_TEMP/thresholds-head.json" || rm -f "$RUNNER_TEMP/thresholds-head.json"
          fi

      - name: Check
        env:
          HAS_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-exception') }}
        run: |
          args=(--files "$RUNNER_TEMP/changed.txt")
          if [ -s "$RUNNER_TEMP/thresholds-base.json" ] && [ -s "$RUNNER_TEMP/thresholds-head.json" ]; then
            args+=(--thresholds-base "$RUNNER_TEMP/thresholds-base.json" --thresholds-head "$RUNNER_TEMP/thresholds-head.json")
          fi
          node scripts/test-bar-paths.mjs "${args[@]}"
